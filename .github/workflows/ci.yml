name: CI

# PR + push checks: typecheck, unit tests, and the headless Safari-extension test.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Build in dependency order — root `npm run build` is NOT topological.
      - run: npm run build --workspace=@windowllm/types --workspace=@windowllm/protocol --workspace=@windowllm/adapters
      - run: npm run build --workspace=@windowllm/client
      - run: npm run build --workspace=@windowllm/vault
      - run: npm run typecheck
      - run: npm test

  extension-webkit:
    name: Safari extension (headless WebKit)
    # Runs the real extension in Apple's WKWebExtension engine (same one Safari
    # embeds) and asserts window.llm.provider === "extension". Requires the public
    # WKWebExtension API: macOS 15.4+ / Xcode 16.3+ (bump the runner if unavailable).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Shared deps that `test:extension:webkit` (vault + extension build) needs.
      - run: npm run build --workspace=@windowllm/types --workspace=@windowllm/protocol --workspace=@windowllm/adapters
      - run: npm run build --workspace=@windowllm/client
      - run: npm run test:extension:webkit
