name: CI

# PR + push checks: typecheck, unit tests, and real extension-runtime E2E tests.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Build in dependency order — root `npm run build` is NOT topological.
      - run: npm run build --workspace=@windowllm/types --workspace=@windowllm/protocol --workspace=@windowllm/adapters
      - run: npm run build --workspace=@windowllm/client
      - run: npm run build --workspace=@windowllm/vault
      - run: npm run typecheck
      - run: npm test

  extension-browsers:
    name: Chrome & Firefox extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@windowllm/types --workspace=@windowllm/protocol --workspace=@windowllm/adapters
      - run: npm run build --workspace=@windowllm/client
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e:extension:chrome
      - run: npm run test:e2e:extension:firefox

  extension-webkit:
    name: Safari extension (headless WebKit)
    # Runs shared API and extension-specific contracts in Apple's real
    # WKWebExtension engine. Requires macOS 15.4+ / Xcode 16.3+.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Shared deps that `test:extension:webkit` (vault + extension build) needs.
      - run: npm run build --workspace=@windowllm/types --workspace=@windowllm/protocol --workspace=@windowllm/adapters
      - run: npm run build --workspace=@windowllm/client
      - run: npm run test:extension:webkit
