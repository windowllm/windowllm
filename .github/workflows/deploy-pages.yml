name: Deploy site to GitHub Pages

# Publishes the vault (frame.html + setup UI) and the client library (llm.js) to
# the gh-pages branch, which GitHub Pages serves at windowllm.org. This is what
# lets sites use WindowLLM in iframe mode with no extension.

on:
  push:
    branches: [main]
    paths:
      - 'packages/vault/**'
      - 'packages/client/**'
      - 'packages/adapters/**'
      - 'packages/protocol/**'
      - 'packages/types/**'
      - 'spec/**'
      - 'docs/index.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Build in dependency order: shared packages -> client (llm.js) -> vault.
      - run: npm run build --workspace=@windowllm/types --workspace=@windowllm/protocol --workspace=@windowllm/adapters
      - run: npm run build --workspace=@windowllm/client
      - run: npm run build --workspace=@windowllm/vault

      - name: Assemble site
        run: |
          rm -rf _site && mkdir -p _site
          cp -r packages/vault/dist/* _site/
          cp packages/client/dist/llm.iife.js _site/llm.js
          # Live demos: static example pages that use window.llm through the vault.
          mkdir -p _site/demo
          cp -r examples/* _site/demo/
          rm -f _site/demo/vite.config.ts
          # Formal ReSpec spec (/spec/) and the friendly developer guide (/docs/).
          # Both are self-contained static HTML — no build step. Because they are
          # real files, GitHub Pages serves them directly (the 404.html SPA
          # fallback never sees these paths).
          mkdir -p _site/spec _site/docs
          cp spec/index.html _site/spec/index.html
          cp docs/index.html _site/docs/index.html
          # SPA fallback so client-routed paths resolve to the app instead of 404:
          #  - /vault           (the vault; served 200 via its own index.html)
          #  - /unlock, etc.    (popup routes opened by llm.js; via 404.html)
          mkdir -p _site/vault
          cp _site/index.html _site/vault/index.html
          cp _site/index.html _site/404.html
          echo windowllm.org > _site/CNAME
          touch _site/.nojekyll

      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
